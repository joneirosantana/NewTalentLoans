<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar empresa | New Talent Loans</title><link rel="stylesheet" href="css/dashboard.css"><script src="scripts/api-client.js"></script><script src="scripts/registroEmpresa.js" defer></script></head><body><main><section class="panel" style="max-width:760px;margin:40px auto"><h1>Registrar empresa</h1><p class="muted">La empresa designa a su encargado de RRHH. Los clientes pagarán personalmente en los puntos de pago de la empresa.</p><form id="empresaForm" class="form-grid"><h2>Datos de la empresa</h2><input name="empresaNombre" placeholder="Nombre de la empresa" required><input name="rnc" placeholder="RNC" required><input name="empresaCorreo" type="email" placeholder="Correo empresarial" required><input name="empresaTelefono" placeholder="Teléfono"><input name="provincia" placeholder="Provincia" required><input name="ciudad" placeholder="Ciudad" required><input name="calle" placeholder="Calle" required><input name="numero" placeholder="Número"><h2>Encargado de RRHH</h2><input name="rrhhNombre" placeholder="Nombre" required><input name="rrhhApellido" placeholder="Apellido" required><input name="rrhhCedula" placeholder="Cédula" required><input name="rrhhCorreo" type="email" placeholder="Correo de RRHH" required><input name="rrhhContrasena" type="password" placeholder="Contraseña de RRHH" minlength="8" required><h2>Dueño lectura de resultados</h2><input name="duenoCorreo" type="email" placeholder="Correo del dueño"><input name="duenoContrasena" type="password" placeholder="Contraseña del dueño" minlength="8"><button type="submit">Registrar empresa</button><p id="mensaje" class="muted"></p></form></section></main></body></html>
