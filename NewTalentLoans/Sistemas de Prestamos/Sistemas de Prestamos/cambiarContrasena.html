<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña | New Talent Loans</title>
    <link rel="icon" type="image/x-icon" href="Imagenes/NewTalentLoans.png">
    
    <!-- Fuente Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <link rel="stylesheet" href="estilos/cambiarContrasena.css">
    <script src="scripts/cambiarContrasena.js" defer></script>
</head>
<body>

    <!-- Contenedor principal (fondo gris claro) -->
    <div class="login-wrapper">
        
        <!-- La Tarjeta del Formulario -->
        <div class="login-card">
            
            <!-- Logo -->
            <div class="logo">
                <img src="Imagenes/NewTalent.png" alt="New Talent Loans Logo">
            </div>

            <h1 class="titulo">Cambiar Contraseña</h1>
            <p class="instruction">Ingrese su contraseña actual y la nueva</p>

            <form id="formCambiarContrasena" novalidate>
                
                <!-- Contraseña Actual -->
                <div class="input-group">
                    <input type="password" id="passwordActual" name="passwordActual" required>
                    <label for="passwordActual">Contraseña Actual:</label>
                    <button type="button" class="toggle-password" data-target="passwordActual">
                        <ion-icon name="eye-outline"></ion-icon>
                    </button>
                </div>

                <!-- Nueva Contraseña -->
                <div class="input-group">
                    <input type="password" id="passwordNueva" name="passwordNueva" required>
                    <label for="passwordNueva">Nueva Contraseña:</label>
                    <button type="button" class="toggle-password" data-target="passwordNueva">
                        <ion-icon name="eye-outline"></ion-icon>
                    </button>
                </div>

                <!-- Indicador de fuerza -->
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <p class="strength-text" id="strengthText">Ingresa una contraseña</p>
                </div>

                <!-- Confirmar Nueva Contraseña -->
                <div class="input-group">
                    <input type="password" id="passwordConfirmar" name="passwordConfirmar" required>
                    <label for="passwordConfirmar">Confirmar Contraseña:</label>
                    <button type="button" class="toggle-password" data-target="passwordConfirmar">
                        <ion-icon name="eye-outline"></ion-icon>
                    </button>
                </div>

                <!-- Requisitos -->
                <div class="requisitos-box">
                    <p class="requisitos-titulo">La nueva contraseña debe contener:</p>
                    <ul class="requisitos-lista">
                        <li id="req-longitud">
                            <ion-icon name="close-circle-outline"></ion-icon>
                            Mínimo 8 caracteres
                        </li>
                        <li id="req-mayuscula">
                            <ion-icon name="close-circle-outline"></ion-icon>
                            Una letra mayúscula
                        </li>
                        <li id="req-minuscula">
                            <ion-icon name="close-circle-outline"></ion-icon>
                            Una letra minúscula
                        </li>
                        <li id="req-numero">
                            <ion-icon name="close-circle-outline"></ion-icon>
                            Un número
                        </li>
                        <li id="req-especial">
                            <ion-icon name="close-circle-outline"></ion-icon>
                            Un carácter especial (!@#$%)
                        </li>
                    </ul>
                </div>

                <!-- Botones -->
                <div class="form-buttons">
                    <button type="button" class="btn-cancelar" id="btnCancelar">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-guardar" id="btnGuardar">
                        <ion-icon name="save-outline"></ion-icon>
                        Actualizar
                    </button>
                </div>

            </form>
        </div>
        
    </div>

    <!-- MODAL DE MENSAJES -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitle">Título</h3>
            <p class="modal-message" id="modalMessage">Mensaje</p>
            <button class="modal-btn" id="modalBtn">Aceptar</button>
        </div>
    </div>

</body>
</html>
