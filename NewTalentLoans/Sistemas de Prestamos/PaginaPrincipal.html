<!DOCTYPE html>
<html lang="es">
    <head>
        <title>¡Bienvenidos a la Pagina New Talent Loans!</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="NewTalentLoans.png">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="estilos/stylesPrincipal.css">
    </head>
    <body>
        <div class="login-container">
        <!-- Logo (Reemplaza 'logo.png' con tu archivo real) -->
        <div class="logo">
            <img src="NewTalent.png">
        </div>

        <p class="instruction">Ingrese sus datos:</p>

        <form action="#" method="POST">
            
            <!-- Campo Correo -->
            <div class="input-group">
                <input type="email" id="correo" name="correo" required>
                <label for="correo">Correo:</label>
            </div>

            <!-- Campo Contraseña -->
            <div class="input-group">
                <input type="password" id="password" name="password" required>
                <label for="password">Contraseña:</label>
            </div>

            <!-- Enlaces de ayuda -->
            <div class="links">
                <p>¿Olvidó su contraseña? <a href="#">¡Cámbiala Aquí!</a></p>
                <p>¿Aun no eres parte de esta compañía? <a href="#">¡Regístrate, es gratis!</a></p>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn-login">Iniciar Sesión</button>

        </form>
    </div>
        

    </body>
</html>
