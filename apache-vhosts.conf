# Copiar estos dos bloques al httpd-vhosts.conf de Apache y agregar las entradas al archivo hosts.
<VirtualHost *:80>
    ServerName newtalentloans.local
    DocumentRoot "C:/xampp/htdocs/newtalentloans 2.0"
    <Directory "C:/xampp/htdocs/newtalentloans 2.0">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName api.newtalentloans.local
    DocumentRoot "C:/xampp/htdocs/newtalentloans 2.0/api"
    <Directory "C:/xampp/htdocs/newtalentloans 2.0/api">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
